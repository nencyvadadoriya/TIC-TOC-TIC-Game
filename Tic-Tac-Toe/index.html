<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tic-Tac-Toe</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./script.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #ec4899;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background: radial-gradient(circle at center, #1e1b4b, #0f172a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
            background: var(--glass);
            padding: 2.5rem;
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Decorative Background Blobs */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.15;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(10%, 10%); }
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .start-btn {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .start-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            align-self: flex-start;
            margin-bottom: -0.5rem;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .Header {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(to right, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.3));
        }

        .setup-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            transition: all 0.3s ease;
        }

        .input-group.hidden {
            display: none;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.7rem 1rem;
            color: white;
            outline: none;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        .mode-selection {
            display: flex;
            gap: 0.8rem;
        }

        .mode-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 0.7rem;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .mode-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .status-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.8rem 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .player-info.active {
            opacity: 1;
            color: var(--primary);
            transform: scale(1.1);
        }

        .grid {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn i {
            width: 60%;
            height: 60%;
            stroke-width: 2.5;
        }

        .x-icon { color: #818cf8; filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.5)); }
        .o-icon { color: #f472b6; filter: drop-shadow(0 0 8px rgba(244, 114, 182, 0.5)); }

        .winner-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .winner-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .winner-card {
            background: var(--glass);
            padding: 3rem 5rem;
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .winner-overlay.show .winner-card {
            transform: scale(1);
        }

        .winner-text {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .reset-btn {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 1rem;
        }

        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .winning-cell {
            background: rgba(99, 102, 241, 0.2) !important;
            border-color: var(--primary) !important;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 10px var(--primary); }
            to { box-shadow: 0 0 25px var(--primary); }
        }
    </style>
</head>
<body>
    <div class="blob"></div>
    <div class="container">
        <!-- Start Screen -->
        <div class="screen active" id="start-screen">
            <h1 class="Header">Tic Tac Toe</h1>
            <div class="setup-panel">
                <div class="mode-selection">
                    <button class="mode-btn" id="pvp-mode">vs Player</button>
                    <button class="mode-btn active" id="pvc-mode">vs Computer</button>
                </div>
                <div class="input-group">
                    <label for="player-name">Player Name (X)</label>
                    <input type="text" id="player-name" placeholder="Enter name" value="Player 1">
                </div>
                <div class="input-group hidden" id="p2-input-group">
                    <label for="player2-name">Player 2 Name (O)</label>
                    <input type="text" id="player2-name" placeholder="Enter name" value="Player 2">
                </div>
                <button class="start-btn" id="start-game-btn">Start Game</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div class="screen" id="game-screen">
            <button class="back-btn" id="back-to-setup"><i data-lucide="chevron-left" style="width: 14px; vertical-align: middle;"></i> Setup</button>
            <div class="status-panel">
                <div class="player-info active" id="p1-info">
                    <i data-lucide="x" class="x-icon" style="width: 24px;"></i>
                    <span id="p1-label">Player X</span>
                </div>
                <div class="player-info" id="p2-info">
                    <i data-lucide="circle" class="o-icon" style="width: 24px;"></i>
                    <span id="p2-label">Player O</span>
                </div>
            </div>

            <div class="grid">
                <button class="btn" id="btn_1"></button>
                <button class="btn" id="btn_2"></button>
                <button class="btn" id="btn_3"></button>
                <button class="btn" id="btn_4"></button>
                <button class="btn" id="btn_5"></button>
                <button class="btn" id="btn_6"></button>
                <button class="btn" id="btn_7"></button>
                <button class="btn" id="btn_8"></button>
                <button class="btn" id="btn_9"></button>
            </div>
        </div>
    </div>

    <div class="winner-overlay" id="overlay">
        <div class="winner-card">
            <div class="winner-text" id="winner-display">X Wins!</div>
            <button class="reset-btn" onclick="window.location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
